name: Temporary Framed allocation benchmark
on:
  push:
    branches:
      - bench/framed-lazy-ci-20261021

permissions:
  contents: read

jobs:
  measure:
    name: Same-runner base vs PR benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare both exact commits and compile the identical Rust harness
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner CPU:"
          lscpu | grep -E 'Model name|CPU\(s\)|Architecture' | head -6 || true
          rustc --version
          cargo --version
          BASE=cffdc7601134598cebc45d03af0358dedfcb3ff1
          PR=e3766e7977c5055256e43306fd3311307bc463d9
          git cat-file -e "$BASE^{commit}" || git fetch origin "$BASE" --depth=1
          git cat-file -e "$PR^{commit}" || git fetch origin "$PR" --depth=1
          git worktree add --detach "$RUNNER_TEMP/tokio-base" "$BASE"
          git worktree add --detach "$RUNNER_TEMP/tokio-pr" "$PR"
          cp tokio-util/examples/framed_lazy_benchmark_temp.rs "$RUNNER_TEMP/benchmark.rs"
          python3 - "$RUNNER_TEMP/benchmark.rs" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          source = p.read_text()
          needle = '        "idle_framed" => {'
          insertion = """        "probe" => {
                      let full = Framed::new((), ());
                      let read = FramedRead::new((), ());
                      let write = FramedWrite::new((), ());
                      println!("PROBE full_read={} full_write={} reader={} writer={}",
                          full.read_buffer().capacity(),
                          full.write_buffer().capacity(),
                          read.read_buffer().capacity(),
                          write.write_buffer().capacity());
                  },
          """
          assert source.count(needle) == 1
          source = source.replace(needle, insertion + needle)
          more_needle = '        "steady_read" => {'
          additional = """        "lines_read" => {
                      let mut data = Vec::with_capacity((count + 1) * 12);
                      for _ in 0..(count + 1) {
                          data.extend_from_slice(b"hello world\\n");
                      }
                      let mut reader = FramedRead::new(&data[..], tokio_util::codec::LinesCodec::new());
                      let mut cx = Context::from_waker(Waker::noop());
                      assert!(matches!(Stream::poll_next(Pin::new(&mut reader), &mut cx), Poll::Ready(Some(Ok(_)))));
                      let before = snapshot();
                      let start = Instant::now();
                      let mut checksum = 0usize;
                      for _ in 0..count {
                          match Stream::poll_next(Pin::new(&mut reader), &mut cx) {
                              Poll::Ready(Some(Ok(line))) => checksum += black_box(line).len(),
                              other => panic!("lines read failed: {other:?}"),
                          }
                      }
                      report(mode, count, start, before);
                      black_box(checksum);
                  }
                  "lines_write" => {
                      let mut writer = FramedWrite::new(tokio::io::sink(), tokio_util::codec::LinesCodec::new());
                      let mut cx = Context::from_waker(Waker::noop());
                      Sink::<&str>::start_send(Pin::new(&mut writer), "hello world").unwrap();
                      let before = snapshot();
                      let start = Instant::now();
                      for _ in 0..count {
                          match Sink::<&str>::poll_ready(Pin::new(&mut writer), &mut cx) {
                              Poll::Ready(Ok(())) => (),
                              other => panic!("lines writer not ready: {other:?}"),
                          }
                          Sink::<&str>::start_send(Pin::new(&mut writer), black_box("hello world")).unwrap();
                      }
                      match Sink::<&str>::poll_flush(Pin::new(&mut writer), &mut cx) {
                          Poll::Ready(Ok(())) => (),
                          other => panic!("lines flush failed: {other:?}"),
                      }
                      report(mode, count, start, before);
                      black_box(writer);
                  }
          """
          assert source.count(more_needle) == 1
          p.write_text(source.replace(more_needle, additional + more_needle))
          PY
          for v in base pr; do
            mkdir -p "$RUNNER_TEMP/tokio-$v/tokio-util/examples"
            cp "$RUNNER_TEMP/benchmark.rs" "$RUNNER_TEMP/tokio-$v/tokio-util/examples/framed_lazy_benchmark_temp.rs"
            CARGO_TARGET_DIR="$RUNNER_TEMP/target-$v" cargo build \
              --manifest-path "$RUNNER_TEMP/tokio-$v/Cargo.toml" \
              -p tokio-util --features codec --release \
              --example framed_lazy_benchmark_temp
            cp "$RUNNER_TEMP/target-$v/release/examples/framed_lazy_benchmark_temp" "$RUNNER_TEMP/bench-$v"
            "$RUNNER_TEMP/bench-$v" probe 1
          done
          BASE_PROBE="$("$RUNNER_TEMP/bench-base" probe 1)"
          PR_PROBE="$("$RUNNER_TEMP/bench-pr" probe 1)"
          echo "Base capacity: $BASE_PROBE"
          echo "PR capacity: $PR_PROBE"
          [[ "$BASE_PROBE" == *"full_read=8192 full_write=8192"* ]]
          [[ "$PR_PROBE" == *"full_read=0 full_write=0"* ]]

      - name: Benchmark construction and steady-state throughput
        shell: bash
        run: |
          set -euo pipefail
          CPU="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          echo "Pinning measurements to CPU $CPU"
          RESULTS="$RUNNER_TEMP/framed-results.txt"
          : > "$RESULTS"
          for mode in idle_framed idle_read idle_write steady_read steady_write lines_read lines_write; do
            case "$mode" in
              idle_*) n=20000 ;;
              lines_*) n=500000 ;;
              *) n=2000000 ;;
            esac
            taskset -c "$CPU" "$RUNNER_TEMP/bench-base" "$mode" "$n" >/dev/null
            taskset -c "$CPU" "$RUNNER_TEMP/bench-pr" "$mode" "$n" >/dev/null
            for round in 1 2 3 4 5 6 7 8 9; do
              if [ $((round % 2)) -eq 1 ]; then versions="base pr"; else versions="pr base"; fi
              for version in $versions; do
                printf 'SAMPLE version=%s round=%d ' "$version" "$round" | tee -a "$RESULTS"
                taskset -c "$CPU" "$RUNNER_TEMP/bench-$version" "$mode" "$n" | tee -a "$RESULTS"
              done
            done
          done
          python3 - "$RESULTS" <<'PY'
          import re
          import statistics
          import sys
          from collections import defaultdict

          results = defaultdict(list)
          for line in open(sys.argv[1]):
              found = dict(re.findall(r"(\w+)=([^\s]+)", line))
              results[(found["mode"], found["version"])].append(found)

          print("SUMMARY (median of 9 alternated runs, after one warmup per version/mode)")
          print("base=cffdc7601134598cebc45d03af0358dedfcb3ff1")
          print("pr=e3766e7977c5055256e43306fd3311307bc463d9")
          print("All timings include benchmark loop only; no process launch or drop cost.")
          summary = [
              "### Framed buffer benchmark (Ubuntu 24.04, same runner, Rust release mode)",
              "",
              "Base cffdc760 vs PR e3766e79. Medians of nine alternating runs after warm-up.",
              "",
              "| Workload | Base | PR | Change | Base allocations | PR allocations |",
              "| --- | ---: | ---: | ---: | ---: | ---: |",
          ]
          for mode in ["idle_framed", "idle_read", "idle_write", "steady_read", "steady_write", "lines_read", "lines_write"]:
              b = results[(mode, "base")]
              p = results[(mode, "pr")]
              assert len(b) == len(p) == 9, (mode, len(b), len(p))
              val = lambda group, key: statistics.median(int(a[key]) for a in group)
              bt = val(b, "elapsed_ns") / 1e6
              pt = val(p, "elapsed_ns") / 1e6
              ba = val(b, "alloc_calls")
              pa = val(p, "alloc_calls")
              bb = val(b, "requested_alloc_bytes")
              pb = val(p, "requested_alloc_bytes")
              delta = (pt / bt - 1) * 100
              print(f"{mode}: n={b[0]['n']}; base={bt:.3f}ms pr={pt:.3f}ms time_delta={delta:+.1f}% base_allocs={ba:g} pr_allocs={pa:g} base_requested_alloc_bytes={bb:g} pr_requested_alloc_bytes={pb:g}")
              summary.append(f"| {mode} ({b[0]['n']} operations) | {bt:.3f} ms | {pt:.3f} ms | {delta:+.1f}% | {ba:g} | {pa:g} |")
          with open("/tmp/benchmark-summary.md", "w") as f:
              f.write("\n".join(summary) + "\n")
          PY
          cat /tmp/benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"
